[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "actionanything"
version = "0.1.0"
description = "A model-agnostic runtime for safe AI agent actions."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Xiongwei Xiao" }
]
keywords = ["ai", "agents", "computer-use", "automation", "safety"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
browser = ["playwright>=1.50,<2"]
dev = ["jsonschema>=4.23,<5"]

[project.scripts]
aa = "actionanything.cli:main"

[project.urls]
Homepage = "https://github.com/xxwtiancai/action-anything"
Repository = "https://github.com/xxwtiancai/action-anything"
Issues = "https://github.com/xxwtiancai/action-anything/issues"

[tool.setuptools.packages.find]
where = ["src"]
