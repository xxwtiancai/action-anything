name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build release distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          PACKAGE_VERSION="$(python -c "import tomllib; from pathlib import Path; print(tomllib.loads(Path('pyproject.toml').read_text())['project']['version'])")"
          if [[ "${RELEASE_TAG}" != "v${PACKAGE_VERSION}" ]]; then
            echo "Release tag ${RELEASE_TAG} does not match package version ${PACKAGE_VERSION}."
            exit 1
          fi
          RUNTIME_VERSION="$(PYTHONPATH=src python -c 'import actionanything; print(actionanything.__version__)')"
          if [[ "${RUNTIME_VERSION}" != "${PACKAGE_VERSION}" ]]; then
            echo "Runtime version ${RUNTIME_VERSION} does not match package version ${PACKAGE_VERSION}."
            exit 1
          fi
      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine
      - name: Build distributions
        run: python -m build --outdir dist
      - name: Validate distribution metadata
        run: python -m twine check dist/*
      - name: Attest release distributions
        uses: actions/attest@v4
        with:
          subject-path: dist/*
      - name: Upload release distributions
        uses: actions/upload-artifact@v7
        with:
          name: release-dists
          path: dist/
          if-no-files-found: error
          retention-days: 30

  upload-release-assets:
    name: Upload GitHub Release assets
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download release distributions
        uses: actions/download-artifact@v8
        with:
          name: release-dists
          path: dist/
      - name: Attach distributions to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "${RELEASE_TAG}" dist/* --clobber

  publish-pypi:
    name: Publish to PyPI
    if: vars.PYPI_PUBLISH_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/actionanything/
    permissions:
      id-token: write

    steps:
      - name: Download release distributions
        uses: actions/download-artifact@v8
        with:
          name: release-dists
          path: dist/
      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
