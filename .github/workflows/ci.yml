name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Compile source
        run: python -m compileall -q src
      - name: Check whitespace
        run: |
          if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^ HEAD
          else
            git diff --check --cached
          fi
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Check installed dependencies
        run: python -m pip check

  windows-recorder-runtime:
    name: Windows recorder/runtime (Python 3.10)
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Run recorder and runtime tests
        run: python -m unittest -v tests.test_recorder tests.test_runtime
      - name: Check installed dependencies
        run: python -m pip check

  build:
    name: Build distributions
    needs: [test, windows-recorder-runtime]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine
      - name: Build distributions
        run: python -m build --outdir dist
      - name: Validate distribution metadata
        run: python -m twine check dist/*
      - name: Verify wheel installation
        run: |
          python -m venv .package-test
          .package-test/bin/python -m pip install --no-index --find-links dist actionanything
          .package-test/bin/python -c "import actionanything; print(actionanything.__version__)"
          .package-test/bin/aa --help
          .package-test/bin/aa validate examples/demo.json
          .package-test/bin/aa schema action > action-schema.json
          .package-test/bin/python -m json.tool action-schema.json >/dev/null
          .package-test/bin/aa schema plan > action-plan-schema.json
          .package-test/bin/python -m json.tool action-plan-schema.json >/dev/null
      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: actionanything-dists
          path: dist/
          if-no-files-found: error
          retention-days: 14
